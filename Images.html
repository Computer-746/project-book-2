<!DOCTYPE html>
<html>
<head>
    <title>Image Animation</title>

    <style>
        .bounce-image {
            width: 300px;

            /* Animation */
            animation: bounce 3s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(500px);
            }
        }
    </style>
</head>

<body>

    <div>
        <h1>Images in HTML</h1>

        <img 
            src="merry-marbling.png" 
            alt="Image" 
            class="bounce-image"
        >
    </div>

</body>
</html>
